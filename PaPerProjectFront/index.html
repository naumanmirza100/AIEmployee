
<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="generator" content="Hostinger Horizons" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pay Per Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
	</head>
	<body>
		<div id="root"></div>
		<script>
			// Applies the saved theme before first paint. Without this the page
			// renders in the default theme for a frame and then snaps to the
			// chosen one — the "flash of wrong theme". Kept inline and tiny on
			// purpose: it has to run before the bundle loads.
			(function () {
				try {
					var saved = localStorage.getItem('ppp-theme') || 'system';
					var dark = saved === 'dark' || (saved === 'system'
						&& window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {
					// Storage blocked — the provider sorts it out after hydration.
				}
			})();
		</script>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
