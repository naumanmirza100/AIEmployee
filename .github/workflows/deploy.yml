name: Deploy to VPS

# Runs whenever main is updated (direct push or a merged PR). Pulls the
# latest code on the VPS and rebuilds the Docker stack — the same two
# commands you'd run by hand:
#   git pull && docker compose up --build -d
on:
  push:
    branches:
      - main
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The SSH handshake to the VPS is occasionally flaky (i/o timeout on
      # port 22 with no rejection — just no response in time) even though
      # sshd and the firewall are both fine; the next attempt usually goes
      # through. Three identical attempts, each allowed to fail without
      # failing the job, so a one-off network hiccup doesn't need a manual
      # re-run — only if all three fail does the job actually fail.
      - name: Deploy over SSH (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/AIEmployee
            git pull
            docker compose up --build -d
            docker image prune -f

      - name: Deploy over SSH (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/AIEmployee
            git pull
            docker compose up --build -d
            docker image prune -f

      - name: Deploy over SSH (attempt 3)
        id: attempt3
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/AIEmployee
            git pull
            docker compose up --build -d
            docker image prune -f
