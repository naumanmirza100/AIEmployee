name: Deploy to VPS

# Runs whenever main is updated (direct push or a merged PR). On the VPS it
# pulls the code and runs scripts/deploy.sh, which builds the image, checks it,
# backs the database up when there are database changes, applies them, switches
# the containers over and then asks the site whether it is well. The job is green
# only if the site answered. It used to be green as soon as the containers had
# been started, whether or not the site came up.
#
# The tests run beside it. For now they do not hold the deploy up: they have
# never been run on a clean machine, so a failure there may be about that
# machine and not the code. Once that job has been green for a while, add it to
# `needs:` on the deploy job and it becomes a gate.
on:
  push:
    branches:
      - main
  workflow_dispatch: # lets you trigger it manually from the Actions tab
    inputs:
      force:
        description: "Try again a commit that already failed to deploy"
        type: boolean
        default: false

jobs:
  tests:
    name: Tests (reported; does not hold up the deploy yet)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # In the same image the server runs, so that what passes here is what is deployed.
      - name: Build the image
        run: docker build -t aiemployee-ci .
      - name: Django's own checks
        run: docker run --rm aiemployee-ci python manage.py check --settings=project_manager_ai.settings_test
      # settings_test: an in-memory database, no outside services, no real email.
      - name: Run the tests
        run: >
          docker run --rm -e PYTHONIOENCODING=utf-8 aiemployee-ci
          python manage.py test
          core project_manager_agent hr_agent Frontline_agent recruitment_agent api
          ai_sdr_agent meeting_agent marketing_agent crm_sync_agent reply_draft_agent
          --settings=project_manager_ai.settings_test

  deploy:
    runs-on: ubuntu-latest
    steps:
      # The SSH handshake to the VPS is occasionally flaky (i/o timeout on
      # port 22 with no rejection — just no response in time) even though
      # sshd and the firewall are both fine; the next attempt usually goes
      # through. Three identical attempts, each allowed to fail without
      # failing the job, so a one-off network hiccup doesn't need a manual
      # re-run — only if all three fail does the job actually fail.
      #
      # A deploy that really failed is not put through three times: the script
      # remembers the commit and the later attempts stop at once (scripts/deploy.sh).
      - name: Deploy over SSH (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/AIEmployee
            git pull
            FORCE=${{ inputs.force && '1' || '0' }} bash scripts/deploy.sh

      - name: Deploy over SSH (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/AIEmployee
            git pull
            bash scripts/deploy.sh

      - name: Deploy over SSH (attempt 3)
        id: attempt3
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/AIEmployee
            git pull
            bash scripts/deploy.sh
